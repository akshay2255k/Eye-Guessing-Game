            background: linear-gradient(-45deg, #0f172a, #1a1a2e, #16213e, #311d3f);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 850px;
            position: relative;
            z-index: 10;
            margin: 30px 0;
        }

        h1 {
            background: linear-gradient(to right, #f1c40f, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 38px;
            font-weight: 800;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(233, 69, 96, 0.6);
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 15px 0;
            padding: 15px 25px;
            border-radius: 15px;
            transition: 0.3s;
        }

        .player-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
            font-size: 16px;
            width: 45%;
            transition: 0.3s;
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
        }

        .category-selection {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
        }

        .category-selection label {
            font-size: 18px;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-selection input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #e94560;
        }

        .key-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.4);
        }

        .key-btn:hover {
            box-shadow: 0 12px 25px rgba(243, 156, 18, 0.6);
        }

        .key-btn.listening {
            background: linear-gradient(135deg, #2ecc71, #27ae60) !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(46, 204, 113, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
            border-color: #e74c3c !important;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.8) !important;
        }

        #splash-screen {
            font-size: 50px;
            font-weight: 800;
            color: #f1c40f;
            letter-spacing: 2px;
        }

        #countdown-number {
            font-size: 120px;
            font-weight: 800;
            color: #e94560;
            margin-top: 20px;
            text-shadow: 0 10px 30px rgba(233, 69, 96, 0.6);
        }

        #game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            flex-wrap: wrap;
        }

        .score-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .score-card span {
            color: #f1c40f;
            font-size: 20px;
            font-weight: 800;
            margin-left: 8px;
        }

        .score-card.active {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.1);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);

        .eye-box {
            margin: 15px auto;
            border: 4px solid #f1c40f;
            border-radius: 15px;
            background-color: #000;
            max-width: 450px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3);
        }

        .eye-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .eye-box.correct {
            border-color: #2ecc71;
            box-shadow: 0 10px 40px rgba(46, 204, 113, 0.6);

            color: #f1c40f;

            font-weight: 600;
            height: 35px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);

            color: #e74c3c;
            font-weight: 800;
            margin-top: 10px;
            height: 35px;
            text-shadow: 0 2px 10px rgba(231, 76, 60, 0.5);

            margin-top: 25px;
            display: none;
            width: 100%;

            text-align: center;
            font-size: 20px;

            margin-top: 20px;
            font-weight: 600;
            height: 30px;

</head>

        </p>
        <div class="btn-group">
            <button onclick="setupPlayers(1)">1 Player</button>
            <button onclick="setupPlayers(2)">2 Players</button>
            <button onclick="setupPlayers(3)">3 Players</button>
            <button onclick="setupPlayers(4)">4 Players</button>
            <button onclick="setupPlayers(5)">5 Players</button>
            <button onclick="setupPlayers(6)">6 Players</button>
        </div>
    </div>

    <!-- PAGE 2: Setup -->
    <div id="page2" class="container" style="display: none;">
        <h1 style="font-size: 32px;">Player Setup</h1>
        <p style="color: #cbd5e1; margin-bottom: 15px;">Enter player names and set their buzzers!</p>

        <div id="players-list"></div>

        <!-- Category Selection -->
        <div class="category-selection">
            <label><input type="checkbox" id="mollywood-cb" checked> Mollywood</label>
            <label><input type="checkbox" id="kollywood-cb" checked> Kollywood</label>
        </div>

        <button
            style="margin-top: 30px; background: linear-gradient(135deg, #2ecc71, #27ae60); box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4);"
            onclick="startSplash()">Ready? Let's Go! 🚀</button>
    </div>

    <!-- PAGE 3: Splash Countdown -->
    <div id="page-splash" class="container"
        style="display: none; text-align: center; border: none; background: transparent; box-shadow: none;">
        <div id="splash-screen">GET READY</div>
        <div id="countdown-number"></div>
    </div>

    <!-- PAGE 4: Main Game -->
    <div id="page-game" class="container" style="display: none;">
        <div id="game-layout">
            <div id="scoreboard"></div>

            <h2 id="question-title" style="color: #cbd5e1; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px;">
                Who is this star? 🕵️</h2>

            <div id="image-container" class="eye-box">
                <img id="actor-image" src="" alt="Actor">
            </div>

            <div id="buzzer-message">Get ready to buzz!</div>
            <div id="timer-display" style="display: none;"></div>

            <div id="answer-section">
                <input type="text" id="guess-input" placeholder="Enter actor's name..." autocomplete="off">
                <br>
                <button id="submit-btn" onclick="checkAnswer()">Submit Answer ✔️</button>
            </div>
            <div id="next-timer-display" style="display: none;"></div>
        </div>
    </div>

    <!-- PAGE 5: Game Over -->
    <div id="page-end" class="container" style="display: none;">
        <h1 style="font-size: 55px; margin-bottom: 10px;">🏆 Game Over! 🏆</h1>
        <p style="color: #cbd5e1; font-size: 18px;">Here are the final scores:</p>
        <div id="winner-board"></div>

        <!-- Restart / Menu Buttons -->
        <div class="end-btn-group">
            <button onclick="restartGame()">Play Again 🔄</button>
            <button style="background: linear-gradient(135deg, #f39c12, #d35400);" onclick="location.reload()">Main Menu

        </div>

        window.addEventListener('keydown', function (e) {
            if (['Space', 'Tab', 'Enter'].includes(e.code)) {
                if (e.target.tagName !== 'INPUT') { e.preventDefault(); }
            }
            if (currentlyListening !== null) {
                e.preventDefault();
                playersData[currentlyListening].key = e.code;
                const btn = document.getElementById(`key-btn-${currentlyListening}`);
                btn.innerText = `Buzzer: ${e.code}`;
                btn.classList.remove('listening');
                currentlyListening = null;
                return;
            }

            if (gameActive) {
                for (let i = 0; i < playersData.length; i++) {
                    if (e.code === playersData[i].key) {
                        e.preventDefault();
                        buzzerPressed(playersData[i], i);
                        return;
                    }
                }
            } else {
                if (e.code === 'Enter' && document.getElementById('guess-input').style.display !== 'none' && activePlayer) {
                    e.preventDefault();
                    checkAnswer();
                }
            }
        }, { passive: false });

        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function setupNewGame(selectedData) {
            let playedActors = JSON.parse(localStorage.getItem('quizPlayedMemory')) || [];
            let availableData = selectedData.filter(actor => !playedActors.includes(actor.folder));

            if (availableData.length < TOTAL_ROUNDS) {
                playedActors = [];
                availableData = [...selectedData];
            }

            availableData.sort(() => Math.random() - 0.5);
            quizData = availableData.slice(0, TOTAL_ROUNDS);

            quizData.forEach(actor => playedActors.push(actor.folder));
            localStorage.setItem('quizPlayedMemory', JSON.stringify(playedActors));

            currentActorIndex = 0;
        }

        // ULTIMATE IMAGE PRELOADER (ഷഫിൾ ചെയ്ത് പടം എടുക്കുന്ന പുതിയ സൂത്രം)

        function loadNextActor() {
            if (currentActorIndex >= quizData.length) {
                endGame();
                return;
            }

            clearInterval(answerTimer);
            clearInterval(nextRoundTimer);
            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('next-timer-display').style.display = 'none';

            const currentFolder = quizData[currentActorIndex].folder;

            // 1 മുതൽ 15 വരെയുള്ള നമ്പറുകൾ ഒരു അറേ ആക്കി മാറ്റുന്നു
            let imageNumbers = [];
            for (let i = 1; i <= MAX_IMAGES_IN_FOLDER; i++) {
                imageNumbers.push(i);
            }
            // നമ്പറുകളെ റാൻഡം ആയി ഷഫിൾ ചെയ്യുന്നു
            imageNumbers.sort(() => Math.random() - 0.5);

            let numIndex = 0;

            function tryLoadImage() {
                // എല്ലാ നമ്പറുകളും നോക്കി പരാജയപ്പെട്ടാൽ (അതായത് ഫോൾഡറിൽ പടമേ ഇല്ലെങ്കിൽ) ഒന്നാമത്തെ പടം കൊടുക്കുന്നു
                if (numIndex >= imageNumbers.length) {
                    showImageOnScreen(currentFolder + 'Image_ (1)_eyes.jpg', currentFolder + 'Image_ (1).jpg');
                    return;
                }

                // ഷഫിൾ ചെയ്തതിൽ നിന്നുള്ള അടുത്ത നമ്പർ എടുക്കുന്നു
                let num = imageNumbers[numIndex];

                const formats = [
                    `Image_  (${num})`,
                    `Image_ (${num})`,
                    `Image_(${num})`,
                    `Image_${num}`
                ];

                let formatIndex = 0;

                function attemptFormat() {
                    // എല്ലാ ഫോർമാറ്റും നോക്കി പരാജയപ്പെട്ടാൽ, അടുത്ത നമ്പറിലേക്ക് പോകുന്നു
                    if (formatIndex >= formats.length) {
                        numIndex++;
                        tryLoadImage();
                        return;
                    }

                    let currentFormat = formats[formatIndex];
                    let eyesPath = currentFolder + currentFormat + '_eyes.jpg';
                    let origPath = currentFolder + currentFormat + '.jpg';

                    let imgTester = new Image();
                    imgTester.onload = function () {
                        // പടം കറക്റ്റ് ആയി കിട്ടിയാൽ സ്ക്രീനിൽ കാണിക്കും!
                        showImageOnScreen(eyesPath, origPath);
                    };
                    imgTester.onerror = function () {
                        // കിട്ടിയില്ലെങ്കിൽ അടുത്ത സ്പേസ് ഫോർമാറ്റ് ചെക്ക് ചെയ്യും
                        formatIndex++;
                        attemptFormat();
                    };
                    imgTester.src = eyesPath;
                }

                attemptFormat();
            }

            // പടം തപ്പാൻ സ്റ്റാർട്ട് ചെയ്യുന്നു 
            tryLoadImage();
        }

        function handleTimeout() {
            soundHeartbeat.pause();

            const currentItem = quizData[currentActorIndex];
            const actualAnswer = currentItem.answer.toLowerCase();
            const imageBox = document.getElementById('image-container');

            soundWrong.play();
            activePlayer.score -= MINUS_MARK;
            updateScoreboard();

            let displayAnswer = actualAnswer.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            document.getElementById('buzzer-message').innerHTML = `⏰ Time Out! <b><span style="color:#e74c3c;">-${MINUS_MARK} Points!</span></b> Right Answer: <b style="color:#fff;">${displayAnswer}</b> 🥲`;
            document.getElementById('buzzer-message').style.color = "#e74c3c";

            imageBox.classList.add('shake-effect');
            setTimeout(() => imageBox.classList.remove('shake-effect'), 500);

            document.getElementById('actor-image').src = currentItem.currentImg;

            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('guess-input').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'none';

            startNextRoundCountdown();
        }

        function checkAnswer() {
            clearInterval(answerTimer);
            soundHeartbeat.pause();

            document.getElementById('timer-display').style.display = 'none';

            const rawGuess = document.getElementById('guess-input').value.toLowerCase().trim();
            const guessClean = rawGuess.replace(/[^a-z0-9]/g, '');
            const guessWords = rawGuess.split(/\s+/);

            const currentItem = quizData[currentActorIndex];
            const actualAnswer = currentItem.answer.toLowerCase();
            const aliases = currentItem.aliases || [];
            const imageBox = document.getElementById('image-container');

            let isCorrect = false;

            if (guessClean !== "") {
                const allAcceptableAnswers = [actualAnswer, ...aliases];

                for (let validAnswer of allAcceptableAnswers) {
                    const validClean = validAnswer.replace(/[^a-z0-9]/g, '');

                    if (guessClean === validClean) {
                        isCorrect = true; break;
                    }
                    if (guessClean.length >= 3 && validClean.includes(guessClean)) {
                        isCorrect = true; break;
                    }
                    let maxTypos = validClean.length > 7 ? 3 : 2;
                    if (getEditDistance(guessClean, validClean) <= maxTypos) {
                        isCorrect = true; break;
                    }
                    let validWords = validAnswer.split(/\s+/);
                    for (let gWord of guessWords) {
                        if (gWord.length < 3) continue;
                        for (let vWord of validWords) {
                            let wordTypos = vWord.length > 5 ? 2 : 1;
                            if (getEditDistance(gWord, vWord) <= wordTypos || vWord.includes(gWord)) {
                                isCorrect = true; break;
                            }
                        }
                        if (isCorrect) break;
                    }
                    if (isCorrect) break;
                }
            }

            if (isCorrect) {
                soundClap.play();
                activePlayer.score += PLUS_MARK;
                updateScoreboard();

                document.getElementById('buzzer-message').innerHTML = `SUPPER! <b>${activePlayer.name}</b> right answer✅ 🥳`;
                document.getElementById('buzzer-message').style.color = "#2ecc71";
                imageBox.classList.add('correct');

                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } else {
                soundWrong.play();
                activePlayer.score -= MINUS_MARK;
                updateScoreboard();

                let displayAnswer = actualAnswer.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

                document.getElementById('buzzer-message').innerHTML = `OOmbikooo! <b><span style="color:#e74c3c;">-${MINUS_MARK} Points!</span></b> Mudukkan!: <b style="color:#fff;">${displayAnswer}</b> 🥲`;
                document.getElementById('buzzer-message').style.color = "#e74c3c";

                imageBox.classList.add('shake-effect');
                setTimeout(() => imageBox.classList.remove('shake-effect'), 500);
            }

            document.getElementById('actor-image').src = currentItem.currentImg;

            document.getElementById('guess-input').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'none';

            startNextRoundCountdown();
        }

        function nextRound() {
            currentActorIndex++;
            loadNextActor();
        }

        function endGame() {
            document.getElementById('page-game').style.display = 'none';
            document.getElementById('page-end').style.display = 'block';
            soundCheer.play();

            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#e94560', '#f1c40f'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#2ecc71', '#3498db'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            const sortedPlayers = [...playersData].sort((a, b) => b.score - a.score);

            const board = document.getElementById('winner-board');
            board.innerHTML = '';
            sortedPlayers.forEach((p, index) => {
                let medal = index === 0 ? '👑' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : '👏'));
                board.innerHTML += `
                    <div class="winner-row">
                        <span>${medal} ${p.name}</span>
                        <span>${p.score} Pts</span>
                    </div>
                `;
            });
        }
    </script>
</body>

</html>
