<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050712" />
  <title>Loading — Into the Unknown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="icons/LOGO.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles_splash.css" />
</head>
<body>
  <main class="splash" id="splash" aria-label="Loading screen">
    <div class="grain"></div>
    <div class="aurora aurora-a"></div><div class="aurora aurora-b"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div>
    <div class="scene" aria-hidden="true">
      <div class="eye-glow"></div>
      <div class="eye left-eye"><span class="lid lid-top"></span><span class="iris"><i></i></span><span class="lid lid-bottom"></span></div>
      <div class="eye right-eye"><span class="lid lid-top"></span><span class="iris"><i></i></span><span class="lid lid-bottom"></span></div>
      <div class="bridge"></div>
    </div>
    <header class="topbar"><span class="eyebrow">Version - 2.1</span><span class="status"><b></b> INITIALIZING</span></header>
    <section class="copy">
      <div class="brand-mark"><img src="icons/LOGO.png" alt="" onerror="this.style.display='none'; document.querySelector('.fallback-mark').style.display='grid'" /><span class="fallback-mark">◈</span></div>
      <p class="kicker">A quiet moment before</p>
      <h1>Spot the<br /><em>Stars</em></h1>
      <p class="description">Get ready for the Game.</p>
    </section>
    <footer class="footer">
      <div class="progress-wrap"><div class="progress-label"><span>LOADING EXPERIENCE</span><span id="percent">00%</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></div>
      <div class="footer-meta"><span>PLEASE WAIT<span class="dots"><i>.</i><i>.</i><i>.</i></span></span><span id="timer">08.00</span></div>
    </footer>
    <div class="cursor-orb" id="cursorOrb"></div>
  </main>
  <script src="js/script_splash.js"></script>
</body>
</html>
